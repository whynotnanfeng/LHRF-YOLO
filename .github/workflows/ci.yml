name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile the package
        run: python -m compileall -q ultralytics scripts

      - name: Check the custom modules import
        run: python -c "from ultralytics.nn.modules import DEPMD, RMELAN, SWF; print('modules OK')"

      - name: Check the two README files agree
        run: python scripts/check_readme_sync.py

      - name: Build the model and verify complexity against the paper
        run: python scripts/smoke_test.py --paper

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff

      # Lint covers the repository's own code. The vendored ultralytics package is
      # checked for syntax errors only, so that upstream style issues do not fail
      # the build and stay easy to reconcile when merging upstream changes.
      - name: Lint repository code
        run: ruff check --select=E9,F scripts ultralytics/nn/modules/__init__.py

      - name: Check formatting
        run: ruff format --check scripts/smoke_test.py scripts/check_readme_sync.py
